<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
body {
  background: #07111f;
  color: #00eaff;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 { margin-top: 60px; }
.circle {
  width: 180px;
  height: 180px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: 40px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 55px;
  box-shadow: 0 0 30px #00eaff;
}
button {
  background: #00eaff;
  color: #07111f;
  border: none;
  padding: 16px 28px;
  border-radius: 30px;
  font-size: 17px;
  margin: 10px;
}
#answer {
  margin-top: 30px;
  color: white;
}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>YOUR PERSONAL AI ASSISTANT</p>

<div class="circle">J</div>

<button onclick="listen()">🎙 TALK TO JARVIS</button>

<div id="answer">Systems Online</div>

<script>
function speak(text) {
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speechSynthesis.speak(speech);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    document.getElementById("answer").innerText =
      "Voice recognition is not supported in this browser.";
    return;
  }

  let rec = new Recognition();
  rec.lang = "en-IN";
  rec.start();

  rec.onresult = function(event) {
    let command = event.results[0][0].transcript.toLowerCase();
    let reply = "I am still learning. You said " + command;

    if (command.includes("hello")) {
      reply = "Hello! I am JARVIS. How can I help you?";
    }
    else if (command.includes("time")) {
      reply = "The time is " +
        new Date().toLocaleTimeString();
    }
    else if (command.includes("date")) {
      reply = "Today's date is " +
        new Date().toDateString();
    }
    else if (command.includes("youtube")) {
      window.open("https://youtube.com", "_blank");
      reply = "Opening YouTube.";
    }
    else if (command.includes("google")) {
      window.open("https://google.com", "_blank");
      reply = "Opening Google.";
    }

    document.getElementById("answer").innerText = reply;
    speak(reply);
  };
}
</script>

</body>
</html>
